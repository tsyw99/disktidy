[package]
name = "disktidy-lib"
version = "2.0.1"
description = "Windows磁盘清理工具"
authors = ["DiskTidy Team"]
edition = "2021"

[lib]
name = "disktidy_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "disktidy"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
walkdir = "2"
sysinfo = "0.33"
thiserror = "1"
sha2 = "0.10"
glob-match = "0.2"
dirs = "5"
uuid = { version = "1", features = ["v4", "serde"] }
lazy_static = "1.4"
once_cell = "1"
hostname = "0.4"
chrono = "0.4"
futures = "0.3"
lru = "0.12"
rayon = "1"
log = "0.4"
env_logger = "0.11"
reqwest = { version = "0.12", features = ["json", "stream"] }
async-trait = "0.1"
keyring = { version = "3", features = ["windows-native", "sync-secret-service"] }
rig-core = "0.39"
tokio-stream = "0.1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Com",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
] }
winreg = "0.52"

[profile.release]
codegen-units = 1
lto = false
opt-level = "z"
strip = true
debug = false
rpath = false
debug-assertions = false
overflow-checks = false

[profile.dev]
opt-level = 1
debug = true
debug-assertions = true
overflow-checks = true
lto = false
